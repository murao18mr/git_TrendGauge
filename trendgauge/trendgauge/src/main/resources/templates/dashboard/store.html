<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダッシュボード - TrendGauge</title>
</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/store-header :: store-header}"></header>
        <div class="col-md-5 mx-auto py-4">
            <div>
                <button type="button" class="btn btn-primary w-25 mt-3 btn-lg">昨対比</button>
                <button type="button" class="btn btn-primary w-25 mt-3 btn-lg">予算達成率</button>
            </div>

            <div id="ranking-area mt-4">
                <h3 class="mb-3">店舗別昨対比ランキング</h3>

                <div class="list-group">

                    <div th:each="store, storeStat : ${ranking}"
                         class="list-group-item d-flex justify-content-between align-items-center">

                        <div>
                <span class="fw-bold me-2"
                      th:text="${storeStat.index + 1}"></span>

                            <span th:text="${store.storeName}"></span>
                        </div>

                        <span th:if="${store.ratio != null}"
                              th:text="${store.ratio + '%'}"></span>

                        <span th:if="${store.ratio == null}">
                -
            </span>

                    </div>
                </div>

            </div>
            <div id="budget-ranking-area" class="mt-4">

                <h3 class="mb-3">店舗別予算達成率ランキング</h3>

                <div class="list-group">

                    <div th:each="store, storeStat : ${budgetRanking}"
                         class="list-group-item d-flex justify-content-between align-items-center">

                        <div>
                <span class="fw-bold me-2"
                      th:text="${storeStat.index + 1}"></span>

                            <span th:text="${store.storeName}"></span>
                        </div>

                        <span th:if="${store.ratio != null}"
                              th:text="${store.ratio + '%'}"></span>

                        <span th:if="${store.ratio == null}">
                -
            </span>

                    </div>

                </div>

            </div>
        </div>

    </main>

</div>

</body>
</html>
