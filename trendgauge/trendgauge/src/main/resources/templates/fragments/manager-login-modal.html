<div th:fragment="manager-login-modal" class="modal fade" id="manager-login-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">店長ログイン（PIN認証）</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>店長用PINコードを入力してください。</p>


            </div>
            <div class="modal-footer justify-content-center gap-5">
                <button type="button" class="btn btn-secondary memo-button" data-bs-dismiss="modal">
                    キャンセル
                </button>
                <button type="button" class="btn btn-primary memo-button">
                    ログイン
                </button>
            </div>

        </div>
    </div>
</div>
