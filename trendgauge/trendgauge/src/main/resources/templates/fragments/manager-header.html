<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Header</title>
</head>
<body>
<header th:fragment="manager-header" class="header navbar py-0">
    <div class="container-fluid">
        <a th:href="@{/manager/menu}" class="navbar-brand">
            <img th:src="@{/images/logo.png}" alt="TrendGauge">
        </a>

        <ul class="navbar-nav flex-row align-items-center ms-4 gap-5 me-3">
            <li class="nav-item">
                <a th:href="@{/manager/menu}" class="nav-link">
                    店長メニュー
                </a>
            </li>
            <li>
                <a th:href="@{/manager/sales/edit}" class="nav-link">
                    売上データ
                </a>
            </li>
            <li>
                <a th:href="@{/manager/reports}" class="nav-link">
                    週報
                </a>
            </li>
            <li>
                <a th:href="@{/manager/setting}" class="nav-link">
                    設定
                </a>
            </li>
            <li class="nav-item">
                <form th:action="@{/manager/logout}" method="post">
                    <button type="submit" class="nav-link">
                        店舗ダッシュボードに戻る
                    </button>
                </form>
            </li>
        </ul>
    </div>
</header>

</body>
</html>
