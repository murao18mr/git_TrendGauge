<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Header</title>
</head>
<body>
<header th:fragment="admin-header" class="header navbar py-0">
    <div class="container-fluid">
        <a th:href="@{/admin/main}" class="navbar-brand">
            <img th:src="@{/images/logo.png}" alt="TrendGauge">
        </a>

        <ul class="navbar-nav flex-row ms-4 gap-5 me-3">
            <li class="nav-item">
                <a th:href="@{/admin/main}" class="nav-link">ダッシュボード</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/ranking}" class="nav-link">全店舗ランキング</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/export}" class="nav-link">データ出力</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/account}" class="nav-link">店舗管理</a>
            </li>
            <li class="nav-item">
                <form th:action="@{/admin/logout}" method="post">
                    <button type="submit" class="nav-link">
                        ログアウト
                    </button>
                </form>
            </li>
        </ul>
    </div>
</header>

</body>
</html>
