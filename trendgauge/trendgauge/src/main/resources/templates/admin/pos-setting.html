<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>外部API接続設定 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/admin-header :: admin-header}"></header>
        <div class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>外部API接続設定（POSレジ連携）</h3>
                        </div>
                        <div class="card-body p-4">
                            <form class="px-3" th:action="@{/admin/setting/pos}" th:object="${adminPosSettingInput}"
                                  method="post">
                                <div class="mb-2">
                                    <label for="target-store" class="form-label">対象店舗</label>
                                    <p class="error-message" th:if="${#fields.hasErrors('storeId')}"
                                       th:errors="*{storeId}"></p>
                                    <select id="target-store"
                                            class="form-select short-input"
                                            th:field="*{storeId}">
                                        <option value="">店舗を選択してください</option>
                                        <option th:each="store : ${stores}"
                                                th:value="${store.id}"
                                                th:text="${store.storeName}">
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="pos-type" class="form-label">連携先POSレジ</label>
                                    <p class="error-message" th:if="${#fields.hasErrors('posType')}"
                                       th:errors="*{posType}"></p>
                                    <select id="pos-type" class="form-select short-input" th:field="*{posType}">
                                        <option value="">POSレジを選択してください</option>
                                        <option value="smaregi">スマレジ</option>
                                    </select>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="contract-id" class="form-label">契約者ID</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('contractId')}"
                                           th:errors="*{contractId}"></p>
                                        <input type="text" id="contract-id" class="form-control"
                                               th:field="*{contractId}">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="client-id" class="form-label">クライアントID</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('clientId')}"
                                           th:errors="*{clientId}"></p>
                                        <input type="text" id="client-id" class="form-control"
                                               th:field="*{clientId}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="client-secret" class="form-label">クライアントシークレット</label>
                                    <p class="error-message" th:if="${#fields.hasErrors('clientSecret')}"
                                       th:errors="*{clientSecret}"></p>
                                    <div class="input-group">
                                        <input type="password"
                                               id="client-secret"
                                               name="clientSecret"
                                               class="form-control"
                                               autocomplete="new-password">
                                        <button type="button" id="toggle-client-secret"
                                                class="btn btn-outline-secondary">
                                            表示
                                        </button>
                                    </div>
                                    <p class="form-text">
                                        新規登録時は必須です。登録済みの場合、空欄のまま保存すると現在のシークレットを維持します。
                                        変更する場合のみ入力してください。
                                    </p>
                                    <p class="text-muted small mt-1 secret-message"
                                       th:if="${#fields.hasAnyErrors()}">
                                        入力内容にエラーがあったため、クライアントシークレットを再入力してください。
                                    </p>
                                </div>

                                <div class="mb-3">
                                    <label for="smaregi-store-id" class="form-label">スマレジ店舗ID</label>
                                    <p class="error-message"
                                       th:if="${#fields.hasErrors('smaregiStoreId')}"
                                       th:errors="*{smaregiStoreId}"></p>

                                    <input type="text"
                                           id="smaregi-store-id"
                                           class="form-control short-input"
                                           th:field="*{smaregiStoreId}"
                                           maxlength="20">

                                    <p class="form-text">
                                        スマレジ側の店舗IDを入力してください。 売上データの取得対象となる店舗を指定します。
                                    </p>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">自動同期設定</label>

                                        <div class="d-flex gap-4">
                                            <div class="form-check">
                                                <input type="radio"
                                                       id="auto-sync-on"
                                                       th:field="*{autoSync}"
                                                       value="true"
                                                       class="form-check-input">
                                                <label for="auto-sync-on" class="form-check-label">
                                                    同期する
                                                </label>
                                            </div>

                                            <div class="form-check">
                                                <input type="radio"
                                                       id="auto-sync-off"
                                                       th:field="*{autoSync}"
                                                       value="false"
                                                       class="form-check-input">
                                                <label for="auto-sync-off" class="form-check-label">
                                                    同期しない
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-6" id="sync-time-area">
                                        <label for="sync-time" class="form-label">同期実行タイミング</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('syncTime')}"
                                           th:errors="*{syncTime}"></p>
                                        <input type="time"
                                               id="sync-time"
                                               th:field="*{syncTime}"
                                               class="form-control">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label class="form-label mb-0">接続テスト・手動同期</label>

                                        <div class="d-flex gap-3">
                                            <button type="button"
                                                    id="connection-test"
                                                    class="btn btn-outline-primary">
                                                接続テスト
                                            </button>

                                            <button type="button"
                                                    id="sync-button"
                                                    class="btn btn-primary">
                                                <i class="bi bi-arrow-repeat me-1"></i>
                                                今すぐ同期
                                            </button>
                                        </div>
                                    </div>

                                    <div id="connection-result" class="mt-3">
                                    </div>
                                </div>


                                <div class="d-flex justify-content-center gap-5">
                                    <a th:href="@{/admin/account}" class="btn btn-secondary action-button">
                                        キャンセル
                                    </a>
                                    <button type="submit"
                                            id="save-setting"
                                            class="btn btn-primary action-button">
                                        保存
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/admin-pos-setting.js"></script>
</body>
</html>
