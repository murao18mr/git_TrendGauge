<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アカウント・店舗管理 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/admin-header :: admin-header}"></header>
        <div class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-11">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>アカウント・店舗管理</h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="card p-3 setting-section mb-5">
                                <h5>店舗アカウント新規登録</h5>
                                <form>
                                    <div class="row g-3 justify-content-center">
                                        <div class="col-md-5">
                                            <label for="store-name" class="form-label">店舗名</label>
                                            <input type="text"
                                                   id="store-name"
                                                   name="store-name"
                                                   class="form-control"
                                                   placeholder="店舗名を入力">
                                        </div>
                                        <div class="col-md-5">
                                            <label for="store-code" class="form-label">店舗コード</label>
                                            <input type="text"
                                                   id="store-code"
                                                   name="store-code"
                                                   class="form-control"
                                                   placeholder="半角英数字20文字以内">
                                        </div>
                                    </div>
                                    <div class="row g-3 justify-content-center mt-2">
                                        <div class="col-md-4">
                                            <label for="email" class="form-label">メールアドレス</label>
                                            <input type="email"
                                                   id="email"
                                                   name="email"
                                                   class="form-control"
                                                   placeholder="メールアドレスを入力">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="password" class="form-label">パスワード</label>
                                            <input type="password"
                                                   id="password"
                                                   name="password"
                                                   class="form-control"
                                                   placeholder="8文字以上">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="password-confirm"
                                                   class="form-label">パスワード（確認）</label>
                                            <input type="password"
                                                   id="password-confirm"
                                                   name="password-confirm"
                                                   class="form-control"
                                                   placeholder="パスワードを再入力">
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center gap-5 mt-4">
                                        <button type="reset" class="btn btn-secondary action-button">
                                            入力内容クリア
                                        </button>
                                        <button type="submit" id="report-register"
                                                class="btn btn-primary action-button">
                                            登録
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <div class="card p-3 setting-section">
                                <h5>店舗アカウント一覧</h5>
                                <div class="table-responsive mt-3">
                                    <table class="table table-bordered text-center align-middle">
                                        <thead class="table-light">
                                        <tr>
                                            <th>店舗コード</th>
                                            <th>店舗名</th>
                                            <th>メールアドレス</th>
                                            <th>状態</th>
                                            <th>アクション</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="store : ${storeAccounts}">
                                            <td th:text="${store.storeCode}"></td>
                                            <td th:text="${store.storeName}"></td>
                                            <td th:text="${store.email}"></td>
                                            <td th:text="${store.statusText}"></td>
                                            <td class="py-3">
                                                <div class="d-flex justify-content-around">
                                                    <button type="button" class="btn btn-primary px-4 btn-sm">
                                                        編集
                                                    </button>
                                                    <button type="button" class="btn btn-primary btn-sm">
                                                        パスワード再設定
                                                    </button>
                                                    <a class="btn btn-primary px-4 btn-sm">API設定</a>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
