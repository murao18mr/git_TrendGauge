<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アカウント・店舗管理 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/admin-header :: admin-header}"></header>
        <div class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-11">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>アカウント・店舗管理</h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="card p-3 setting-section mb-5">
                                <h5>店舗アカウント新規登録</h5>
                                <form id="account-register-form" th:object="${adminAccountInput}"
                                      th:action="@{/admin/account}" method="post">
                                    <div class="row g-3 justify-content-center">
                                        <div class="col-md-3">
                                            <label for="store-name" class="form-label">店舗名</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('storeName')}"
                                               th:errors="*{storeName}"></p>
                                            <input type="text"
                                                   id="store-name"
                                                   th:field="*{storeName}"
                                                   class="form-control"
                                                   placeholder="店舗名を入力">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="store-code" class="form-label">店舗コード</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('storeCode')}"
                                               th:errors="*{storeCode}"></p>
                                            <input type="text"
                                                   id="store-code"
                                                   th:field="*{storeCode}"
                                                   class="form-control"
                                                   placeholder="半角英数字20文字以内">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="manager-pin" class="form-label">初期店長PIN</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('managerPin')}"
                                               th:errors="*{managerPin}"></p>
                                            <input type="password"
                                                   id="manager-pin"
                                                   th:field="*{managerPin}"
                                                   class="form-control"
                                                   placeholder="4桁の数字">
                                        </div>
                                    </div>
                                    <div class="row g-3 justify-content-center mt-2">
                                        <div class="col-md-3">
                                            <label for="email" class="form-label">メールアドレス</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('email')}"
                                               th:errors="*{email}"></p>
                                            <input type="text"
                                                   id="email"
                                                   th:field="*{email}"
                                                   class="form-control"
                                                   placeholder="メールアドレスを入力">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="password" class="form-label">パスワード</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('password')}"
                                               th:errors="*{password}"></p>
                                            <input type="password"
                                                   id="password"
                                                   th:field="*{password}"
                                                   class="form-control"
                                                   placeholder="8文字以上">
                                        </div>
                                        <div class="col-md-3">
                                            <label for="confirm-password"
                                                   class="form-label">パスワード（確認）</label>
                                            <p class="error-message" th:if="${#fields.hasErrors('confirmPassword')}"
                                               th:errors="*{confirmPassword}"></p>
                                            <p class="error-message" th:if="${#fields.hasErrors('passwordMatching')}"
                                               th:errors="*{passwordMatching}"></p>
                                            <input type="password"
                                                   id="confirm-password"
                                                   th:field="*{confirmPassword}"
                                                   class="form-control"
                                                   placeholder="パスワードを再入力">
                                        </div>
                                    </div>
                                    <div class="row g-3 justify-content-center mt-2">
                                        <div class="col-md-3">
                                            <label for="opening-time" class="form-label">開店時間</label>
                                            <input type="time"
                                                   id="opening-time"
                                                   th:field="*{openingTime}"
                                                   class="form-control">
                                            <small class="text-muted">任意</small>
                                        </div>

                                        <div class="col-md-3">
                                            <label for="closing-time" class="form-label">閉店時間</label>
                                            <input type="time"
                                                   id="closing-time"
                                                   th:field="*{closingTime}"
                                                   class="form-control">
                                            <small class="text-muted">任意</small>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center gap-5 mt-4">
                                        <button id="clear" type="button" class="btn btn-secondary action-button">
                                            入力内容クリア
                                        </button>
                                        <button type="submit" id="report-register"
                                                class="btn btn-primary action-button">
                                            登録
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <div class="card p-3 setting-section">
                                <h5>店舗アカウント一覧</h5>
                                <div class="table-responsive mt-3">
                                    <table class="table table-bordered text-center align-middle">
                                        <thead class="table-light">
                                        <tr>
                                            <th>店舗コード</th>
                                            <th>店舗名</th>
                                            <th>メールアドレス</th>
                                            <th>状態</th>
                                            <th>営業時間</th>
                                            <th>アクション</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="store : ${storeAccounts}"
                                            th:attr="data-store-id=${store.storeId},
                                            data-store-code=${store.storeCode},
                                            data-store-name=${store.storeName},
                                            data-email=${store.email},
                                            data-status=${store.status},
                                            data-opening-time=${store.openingTime},
                                            data-closing-time=${store.closingTime}">

                                            <td th:text="${store.storeCode}"></td>
                                            <td th:text="${store.storeName}"></td>
                                            <td th:text="${store.email}"></td>
                                            <td th:text="${store.statusText}"></td>
                                            <td>
                                                <span th:if="${store.openingTime != null and store.closingTime != null}"
                                                      th:text="${store.openingTime + ' ～ ' + store.closingTime}">
                                                </span>
                                                <span th:unless="${store.openingTime != null and store.closingTime != null}">
                                                    未設定
                                                </span>
                                            </td>
                                            <td class="py-3">
                                                <div class="d-flex justify-content-around">
                                                    <button type="button" class="btn btn-primary px-4 btn-sm"
                                                            data-bs-toggle="modal"
                                                            data-bs-target="#edit-modal">
                                                        編集
                                                    </button>
                                                    <button type="button" class="btn btn-primary btn-sm"
                                                            data-bs-toggle="modal"
                                                            data-bs-target="#password-modal">
                                                        パスワード再設定
                                                    </button>
                                                    <a th:href="@{/admin/setting/pos}"
                                                       class="btn btn-primary px-4 btn-sm">API設定</a>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--            編集モーダル-->
            <div class="modal fade" id="edit-modal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">店舗編集</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="edit-store-code" class="form-label">店舗コード</label>
                                <p id="edit-store-code-error" class="error-message"></p>
                                <input type="text" id="edit-store-code" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="edit-store-name" class="form-label">店舗名</label>
                                <p id="edit-store-name-error" class="error-message"></p>
                                <input type="text" id="edit-store-name" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="edit-email" class="form-label">メールアドレス</label>
                                <p id="edit-email-error" class="error-message"></p>
                                <input type="email" id="edit-email" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">状態</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input type="radio"
                                               id="edit-status-active"
                                               name="edit-status"
                                               value="active"
                                               class="form-check-input">
                                        <label for="edit-status-active" class="form-check-label">
                                            営業中
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input type="radio"
                                               id="edit-status-closed"
                                               name="edit-status"
                                               value="closed"
                                               class="form-check-input">
                                        <label for="edit-status-closed" class="form-check-label">
                                            閉店
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">営業時間</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="time" id="edit-opening-time" class="form-control">
                                    <span>～</span>
                                    <input type="time" id="edit-closing-time" class="form-control">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer justify-content-center gap-5">
                            <button type="button" class="btn btn-secondary action-button"
                                    data-bs-dismiss="modal">
                                キャンセル
                            </button>
                            <button type="button" id="save-edit-button"
                                    class="btn btn-primary action-button">
                                保存
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!--            パスワード再設定モーダル-->
            <div class="modal fade" id="password-modal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">パスワード再設定</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <h5><span class="password-label">パスワード再設定対象店舗：</span><span
                                    id="password-store-name">店舗名</span></h5>
                            <input type="hidden" id="password-store-id">
                            <div class="my-3">
                                <label for="reset-password" class="form-label">新しいパスワード</label>
                                <p id="reset-password-error" class="error-message"></p>
                                <input type="password"
                                       id="reset-password"
                                       class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="reset-confirm-password"
                                       class="form-label">新しいパスワード（確認）</label>
                                <p id="reset-confirm-password-error" class="error-message"></p>
                                <p id="reset-password-matching-error" class="error-message"></p>
                                <input type="password"
                                       id="reset-confirm-password"
                                       class="form-control">
                            </div>

                        </div>
                        <div class="modal-footer justify-content-center gap-5">
                            <button type="button" class="btn btn-secondary action-button"
                                    data-bs-dismiss="modal">
                                キャンセル
                            </button>
                            <button type="button" id="save-password-button"
                                    class="btn btn-primary action-button">
                                保存
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<button type="button" id="back-to-top" class="btn btn-primary">
    ↑ TOP
</button>
<script src="/js/admin-account.js"></script>
</body>
</html>
