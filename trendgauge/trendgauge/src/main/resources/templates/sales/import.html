<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSVインポート - TrendGauge</title>
</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/store-header :: store-header}"></header>
        <div class="container py-5">
            <div class="row justify-content-center">

                <div class="col-md-10">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>CSVデータインポート</h3>
                        </div>
                        <div class="card-body">
                            <form method="post" enctype="multipart/form-data">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <div class="mb-2">
                                    <label for="csv-file" class="form-label fs-5 fw-bold">CSVファイル</label>
                                    <input type="file"
                                           id="csv-file"
                                           name="csvFile"
                                           class="form-control"
                                           accept=".csv">
                                </div>
                                <div class="mb-2">
                                    <span>店舗名：</span>
                                    <span th:text="${storeName}"></span>
                                </div>

                                <div class="mb-4">
                                    <h5>CSVプレビュー</h5>
                                    <div class="table-responsive">
                                        <table class="table table-bordered">
                                            <thead>
                                            <tr>
                                                <th>行番号</th>
                                                <th>日付</th>
                                                <th>売上金額</th>
                                                <th>客数</th>
                                                <th>カテゴリ</th>
                                                <th>カラー</th>
                                                <th>数量</th>
                                                <th>小計</th>
                                                <th>エラー</th>
                                            </tr>
                                            </thead>
                                            <tbody id="preview-body">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div id="mapping-area" class="mb-2 d-none">
                                    <h5>マッピング設定</h5>
                                    <p>未登録のCSVフォーマットです。各列に該当する項目を選択してください。<strong>日付と日次売上金額は必須項目です。</strong></p>
                                    <div id="mapping-fields"></div>
                                    <div id="mapping-hidden-fields"></div>
                                </div>

                                <div class="d-flex justify-content-center gap-5 mt-3">
                                    <a th:href="@{/main}"
                                       class="btn btn-secondary action-button">
                                        キャンセル
                                    </a>
                                    <button type="submit" id="import-button"
                                            class="btn btn-primary action-button"
                                            disabled>
                                        取り込み実行
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/memo-modal :: memo-modal}"></th:block>
<th:block th:replace="~{fragments/manager-login-modal :: manager-login-modal}"></th:block>
<script src="/js/memo.js"></script>
<script th:src="@{/js/csv-import.js}"></script>
</body>
</html>
