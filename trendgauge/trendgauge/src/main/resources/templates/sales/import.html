<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSVインポート - TrendGauge</title>
</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/store-header :: store-header}"></header>
        <div class="container py-5">
            <div class="row justify-content-center">

                <div class="col-md-10">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>CSVデータインポート</h3>
                        </div>
                        <div class="card-body">
                            <form method="post" enctype="multipart/form-data">
                                <div class="mb-2">
                                    <label for="csv-file" class="form-label">CSVファイル</label>
                                    <input type="file"
                                           id="csv-file"
                                           name="csvFile"
                                           class="form-control"
                                           accept=".csv">
                                </div>
                                <div class="mb-2">
                                    <span>店舗名：</span>
                                    <span th:text="${storeName}"></span>
                                </div>

                                <div class="mb-4">
                                    <h5>CSVプレビュー</h5>
                                    <div class="table-responsive">
                                        <table class="table table-bordered">
                                            <thead>
                                            <tr>
                                                <th>日付</th>
                                                <th>売上金額</th>
                                                <th>客数</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr>
                                                <td>---</td>
                                                <td>---</td>
                                                <td>---</td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div id="mapping-area" class="mb-2 d-none">
                                    <h5>マッピング設定</h5>
                                    <p>未登録のCSVフォーマットです。各列に該当する項目を選択してください。</p>
                                    <div class="mb-3">
                                        <label for="column1" class="form-label">CSV列1</label>
                                        <select id="column1" class="form-select">
                                            <option value="">選択してください</option>
                                            <option value="date">日付</option>
                                            <option value="amount">日次売上金額</option>
                                            <option value="customerCount">客数</option>
                                            <option value="category">カテゴリ</option>
                                            <option value="color">カラー</option>
                                            <option value="quantity">数量</option>
                                            <option value="subtotal">小計</option>
                                            <option value="skip">対象外（スキップ）</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-center gap-5 mt-3">
                                    <a th:href="@{/main}"
                                       class="btn btn-secondary action-button">
                                        キャンセル
                                    </a>
                                    <button type="submit"
                                            class="btn btn-primary action-button">
                                        取り込み実行
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
