<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日次報告作成 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/store-header :: store-header}"></header>
        <div class="container py-5">
            <div class="row">

                <div class="col-md-10">
                    <div class="card display-card">
                        <div class="card-header text-center">
                            <h3>日次報告作成</h3>
                        </div>
                        <div class="card-body">
                            <form id="daily-report-form">
                                <div>
                                    <label for="sales-date">報告する日付</label>
                                    <input type="date" id="sales-date">
                                </div>

                                <div>
                                    <label for="sales-amount">売上金額</label>
                                    <input type="number" id="sales-amount">
                                </div>

                                <div>
                                    <label for="customer-count">客数</label>
                                    <input type="number" id="customer-count">
                                </div>

                                <div>
                                    <label for="weather">天候</label>
                                    <select id="weather">
                                        <option>晴れ</option>
                                        <option>曇り</option>
                                        <option>雨</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="report-comment">所感・メモ</label>
                                    <textarea id="report-comment"></textarea>
                                </div>
                                <button type="button" class="btn btn-secondary">キャンセル</button>
                                <button type="button" id="report-register" class="btn btn-primary">登録</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
