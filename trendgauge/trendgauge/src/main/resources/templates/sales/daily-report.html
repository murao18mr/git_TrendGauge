<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日次報告作成 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/store-header :: store-header}"></header>
        <div class="container py-5">
            <div class="row justify-content-center">

                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>日次報告作成</h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/sales/new}" method="post" th:object="${dailyReportInput}"
                                  id="daily-report-form" class="px-4">
                                <div class="form-content">
                                    <div class="mb-2">
                                        <label for="sales-date">報告する日付</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('saleDate')}" th:errors="*{saleDate}"></p>
                                        <input type="date"
                                               id="sales-date"
                                               th:field="*{saleDate}"
                                               class="form-control short-input">
                                    </div>

                                    <div class="mb-2">
                                        <label for="sales-amount">売上金額</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('salesAmount')}" th:errors="*{salesAmount}"></p>
                                        <input type="number"
                                               id="sales-amount"
                                               th:field="*{salesAmount}"
                                               class="form-control short-input">
                                    </div>

                                    <div class="mb-2">
                                        <label for="customer-count">客数</label>
                                        <p class="error-message" th:if="${#fields.hasErrors('customerCount')}" th:errors="*{customerCount}"></p>
                                        <input type="number"
                                               id="customer-count"
                                               th:field="*{customerCount}"
                                               class="form-control short-input">
                                    </div>

                                    <div class="mb-2">
                                        <label for="weather">天候</label>
                                        <select id="weather"
                                                th:field="*{weather}"
                                                class="form-control short-input">
                                            <option value="晴れ">晴れ</option>
                                            <option value="曇り">曇り</option>
                                            <option value="雨">雨</option>
                                            <option value="雪">雪</option>
                                            <option value="その他">その他</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <label for="report-comment">所感・メモ</label>
                                        <textarea id="report-comment"
                                                  th:field="*{summary}"
                                                  class="form-control middle-input"></textarea>
                                    </div>

                                </div>
                                <div class="d-flex justify-content-center gap-5 mt-3">
                                    <a th:href="@{/main}"
                                       class="btn btn-secondary action-button">
                                        キャンセル
                                    </a>
                                    <button type="submit" id="report-register"
                                            class="btn btn-primary action-button">
                                        登録
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <div id="sub-display-area" class="card p-3 h-100">
                        <div id="daily-target" class="mb-4">
                            <h5 class="text-center">本日の日割り予算</h5>
                            <span th:if="${dailyTarget != null}"
                                  th:text="${#numbers.formatInteger(dailyTarget, 1, 'COMMA') + '円'}"
                                  class="fs-3 d-block text-center"></span>
                            <span th:if="${dailyTarget == null}"
                                  class="fs-3 d-block text-center">-</span>
                        </div>
                        <div id="memo-area" class="mt-3">
                            <h5 class="text-center">本日のメモ一覧</h5>
                            <div class="memo-list">
                                <div th:each="memo : ${todayMemos}" class="card mb-2">
                                    <div class="card-body py-2">
                                        <span th:text="${#temporals.format(memo.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                                        <span th:text="${memo.comment}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/memo-modal :: memo-modal}"></th:block>
<th:block th:replace="~{fragments/manager-login-modal :: manager-login-modal}"></th:block>
<script src="/js/memo.js"></script>
<script src="/js/manager-login.js"></script>
</body>
</html>
