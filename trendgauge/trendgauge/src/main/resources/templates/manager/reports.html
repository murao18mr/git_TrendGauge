<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ワンタップ週報作成・送信 - TrendGauge</title>

</head>
<body>
<div th:replace="~{layout/index :: layout(~{::title}, ~{::#content})}">
    <main id="content">
        <header th:replace="~{fragments/manager-header :: manager-header}"></header>
        <div class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-10" id="manager-menu">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3>ワンタップ週報作成・送信</h3>
                        </div>
                        <div class="card-body p-3">
                            <div class="row align-items-end mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">対象週</label>
                                    <div id="report-period" class="form-control">
                                        <span th:text="${#temporals.format(startDate, 'yyyy/MM/dd')}"></span>
                                        ～
                                        <span th:text="${#temporals.format(endDate, 'yyyy/MM/dd')}"></span>
                                    </div>
                                </div>

                                <div class="col-md-8 text-md-end mt-3">
                                    <button type="button"
                                            id="generate-report-button"
                                            class="btn btn-primary action-button">
                                        週報を生成
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="report-preview" class="form-label">
                                    自動生成週報プレビュー
                                </label>
                                <textarea id="report-preview"
                                          class="form-control"
                                          rows="13"
                                          readonly></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="report-comment" class="form-label">
                                    店長コメント
                                </label>
                                <textarea id="report-comment"
                                          class="form-control"
                                          rows="4"
                                          placeholder="週報に添付するコメントを入力してください"></textarea>
                                <div class="text-end mt-2">
                                    <button type="button"
                                            id="apply-comment-button"
                                            class="btn btn-primary action-button">
                                        コメントを反映
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-around gap-3 flex-wrap">
                                <button type="button"
                                        id="copy-button"
                                        class="btn btn-primary px-4 action-button">
                                    文面をコピー
                                </button>

                                <button type="button"
                                        id="line-button"
                                        class="btn btn-primary px-4 action-button">
                                    LINEで共有
                                </button>

                                <button type="button"
                                        id="slack-button"
                                        class="btn btn-primary px-4 action-button">
                                    Slackへ送信
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/manager-report.js"></script>
</body>
</html>
